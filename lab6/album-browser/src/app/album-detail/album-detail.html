<div *ngIf="album">   
    <h2>Album Details</h2>
    <p>ID: {{ album.id }}</p>
    <p>User ID: {{ album.userId }}</p>
    <label>Title: </label>
    <input [(ngModel)]="album.title" />
    <br><br>
    <button (click)="save()">Save</button>
    <button (click)="goBack()">Back</button>
    <hr>
    <a [routerLink]="['album-photos']">View Photos</a>
</div>
